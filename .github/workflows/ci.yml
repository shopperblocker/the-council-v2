name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: the-council/backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: the-council/backend/requirements.txt

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest

      - name: Compile check (catch syntax errors)
        run: python -m compileall app/ -q

      - name: Run tests
        run: python -m pytest tests/ -v
        env:
          ANTHROPIC_API_KEY: "sk-test-not-real"

  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: the-council/frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: the-council/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci || npm install

      - name: Type check + Build
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000/api
